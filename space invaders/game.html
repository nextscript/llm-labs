  function sanitizeHSList(list){
      if(!Array.isArray(list)) return [];
      const out=[];
      for(const row of list){
          if(!row || typeof row!=='object') continue;
          const name=String(row.name||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6).padEnd(6,' ');
          const score=(row.score|0);
          out.push({name,score});
      }
      out.sort((a,b)=>b.score-a.score);
      out.splice(5);
      return out;
  }
  function loadHSLocal(){ try{return sanitizeHSList(JSON.parse(localStorage.getItem('gvf_si_hs_cache'))||[]);}catch(_){return[];} }
  function saveHSLocal(l){ try{localStorage.setItem('gvf_si_hs_cache',JSON.stringify(sanitizeHSList(l)));}catch(_){} }
  function loadHS(){ return loadHSLocal(); }
  function saveHS(l){ saveHSLocal(l); }

      const l=loadHS();
      l.push({name:name.toUpperCase().slice(0,6).padEnd(6,' '),score});
      l.sort((a,b)=>b.score-a.score);
      l.splice(5);
      saveHS(l);
      return l;
  }

  function rnd(a,b){return a+Math.random()*(b-a);}

  function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function weightedPick(list){
      let sum=0;
      for(const item of list) sum += Math.max(0,item.weight||0);
      if(sum<=0) return list[0];
      let r=Math.random()*sum;
      for(const item of list){
          r -= Math.max(0,item.weight||0);
          if(r<=0) return item;
      }
      return list[list.length-1];

  function unlockNewSwarmTypes(S,count){
      const locked=FORMATION_TYPES.filter(function(x){ return !S.unlockedFormationTypes.includes(x); });
      const gained=[];
      while(locked.length && gained.length<count){
          const idx=Math.floor(Math.random()*locked.length);
          const id=locked.splice(idx,1)[0];
          S.unlockedFormationTypes.push(id);
          gained.push(id);
      }
      S.lastUnlockedSwarm=gained;
      return gained;
  }
  function hasSwarmCell(type,r,c,rows,cols,lvl){
      const midC=(cols-1)/2;
      const midR=(rows-1)/2;
      const dc=Math.abs(c-midC);
      const dr=Math.abs(r-midR);
      switch(type){
          case 'grid': return true;
          case 'diamond': return (dc/(cols*0.45) + dr/(rows*0.5)) <= 1.02;
          case 'vshape': return r >= Math.floor(dc*0.9)-1;
          case 'pyramid': return c>=r-1 && c<=cols-r;
          case 'checker': return ((r+c+lvl)&1)===0 || r===rows-1;
          case 'wings': return (r>=Math.floor(dc*0.75)) || dr<=0.4;
          case 'cross': return dc<=0.55 || dr<=0.55 || (rows<=4 && (c===Math.floor(midC)||r===Math.floor(midR)));
          case 'ring': return (dc/(cols*0.42)+dr/(rows*0.42)<=1.08) && (dc/(cols*0.22)+dr/(rows*0.22)>=0.82);
          case 'snake':
              return c===Math.floor((Math.sin((r+lvl)*1.15)*0.5+0.5)*(cols-1)) ||
                     c===Math.floor((Math.sin((r+lvl)*1.15)*0.5+0.5)*(cols-1))+1 ||
                     (r%2===0 && c<cols-1 && Math.abs(c-Math.floor((Math.sin((r+lvl)*1.15)*0.5+0.5)*(cols-1)))<=1);
          case 'stagger': return ((c + (r&1)) % 2)===0 || r===rows-1;
          case 'hourglass': return dc <= Math.max(0.8, dr*1.1) && dc >= Math.max(0, dr*0.35-0.15);
          case 'spear': return c===Math.floor(midC) || (r<rows-1 && dc<=r*0.55+0.2);
          case 'fortress': return r===0 || r===rows-1 || c===0 || c===cols-1 || (r===Math.floor(midR) && dc<=1.5);
          case 'zigzag': return c===((r*2 + lvl) % cols) || c===((r*2 + lvl + 1) % cols) || (r===rows-1 && c%2===0);
          case 'arrow': return r>=Math.floor(dc*0.85) || (r===0 && dc<=1.2);
          case 'cage': return c===0 || c===cols-1 || r===0 || r===rows-1 || (c%3===1 && r>0 && r<rows-1);
          case 'columns': return c%2===0 || (rows<=4 && c===cols-1);
          case 'waves': return Math.abs(r - (rows*0.5 + Math.sin((c+lvl)*0.9)*rows*0.22)) <= 0.85 || r===rows-1;
          case 'gapline': return !(r===Math.floor(midR) && c>1 && c<cols-2 && ((c+lvl)%3!==0));
          default: return true;
      }
  }

  // ── STANDARD SPRITE RENDERER (f0/f1 format) ─────────────────────────────────
  function drawPixelSprite(ctx, sprite, frame, x, y, w, h, colors){
      const rows = sprite.f0.length;
      const cols = sprite.f0[0].length;
      const data = frame === 1 ? sprite.f1 : sprite.f0;
      const pw = w / cols;
      const ph = h / rows;
      for(let r=0; r<rows; r++){
          for(let c=0; c<cols; c++){
              const v = data[r][c];
              if(!v) continue;
              ctx.fillStyle = colors[v-1] || colors[0];
              ctx.fillRect(Math.floor(x + c*pw), Math.floor(y + r*ph), Math.ceil(pw), Math.ceil(ph));
          }
      }
  }

  // ── PLAYER SPRITE RENDERER ───────────────────────────────────────────────────
  // Rendert das Spieler-Schiff pixelgenau ohne Flammen-Artefakte
  function drawPlayerSprite(ctx, shipDef, x, y, w, h, shieldActive, invinc, now){
      const colors = [shipDef.color, shipDef.accent, '#ffffff'];
      // Sprite nimmt 85% der Höhe ein, untere 15% = Flamme
      const spriteH = h * 0.82;
      drawPixelSprite(ctx, shipDef, 0, x, y, w, spriteH, colors);

      // Schild-Ellipse
      if(shieldActive){
          ctx.strokeStyle='rgba(83,224,163,0.80)';
          ctx.lineWidth=2.5;
          ctx.beginPath();
          ctx.ellipse(x+w/2, y+spriteH*0.5, w*0.62, spriteH*0.58, 0, 0, Math.PI*2);
          ctx.stroke();
      }

      // Triebwerk-Flamme: nur 2 kleine Blöcke unter dem Rumpf
      const flameW = w * 0.18;
      const flameH = h * 0.18;
      const fy = y + spriteH - flameH * 0.3;
      // Flamme nur wenn nicht invinc-blinkend
      const alpha = invinc ? 0.5 : 0.9;

      // Äußere Flamme
      ctx.fillStyle = shipDef.flame + Math.floor(alpha*0.6*255).toString(16).padStart(2,'0');
      ctx.fillRect(Math.floor(x + w/2 - flameW), fy, Math.ceil(flameW*0.8), Math.ceil(flameH));
      ctx.fillRect(Math.floor(x + w/2 + flameW*0.2), fy, Math.ceil(flameW*0.8), Math.ceil(flameH));

      // Innere Flamme (hell)
      ctx.fillStyle = '#ffdd00' + Math.floor(alpha*0.8*255).toString(16).padStart(2,'0');
      ctx.fillRect(Math.floor(x + w/2 - flameW*0.4), fy, Math.ceil(flameW*0.3), Math.ceil(flameH*0.6));
      ctx.fillRect(Math.floor(x + w/2 + flameW*0.1), fy, Math.ceil(flameW*0.3), Math.ceil(flameH*0.6));
  }

  function archetypePoolForLevel(lvl){
      const tier=Math.floor((lvl-1)/20);
      const pool=[];
      function add(id,base,extraPerTier){
          const a=ENEMY_ARCHETYPES[id];
          if(lvl<a.minLevel) return;
          pool.push({id, weight:base + tier*extraPerTier});
      }
      add('grid',      14, -0.4);
      add('diamond',    4,  0.8);
      add('wings',      2,  1.0);
      add('snake',      1,  1.0);
      add('fortress',   0.5,1.0);
      add('waves',      0.3,1.0);
      add('arrow',      0.2,1.1);
      add('cross',      0.4,0.9);
      return pool.filter(function(x){ return x.weight>0; });
  }
  function pickEnemyArchetypeForLevel(lvl){
      const chosen=weightedPick(archetypePoolForLevel(lvl));
      return ENEMY_ARCHETYPES[chosen.id];
  }

  function mkLevelCfg(lvl, difficulty, stats, unlockedFormationTypes){
      const d=difficulty||0;
      const tier=Math.floor((lvl-1)/12);
      const cols=clamp(6 + Math.floor((lvl-1)/20) + ((lvl%9===0)?1:0), 6, 11);
      const rows=clamp(3 + Math.floor((lvl-1)/28) + ((lvl%17===0)?1:0), 3, 7);
      const unlocked=(unlockedFormationTypes&&unlockedFormationTypes.length)?unlockedFormationTypes:FORMATION_TYPES.slice(0,5);
      const formation=pick(unlocked);
      const lateScale = lvl >= 20 ? Math.pow((lvl - 19), 0.72) * 18 : 0;
      const moveBase = 980 - lvl*2.4 - tier*28 - d*22 - lateScale;
      const shootBase = 1950 - lvl*3.1 - tier*38 - d*28 - lateScale * 1.6;
      const enemyHpBase = lvl < 20
          ? 1
          : 1 + Math.floor((lvl-20)/8) + Math.floor((lvl-20)/25);
      return {
          cols,
          rows,
          moveInterval:Math.max(78, Math.round(moveBase * (stats ? stats.enemyMoveMul : 1))),
          shootInterval:Math.max(260, Math.round(shootBase * (stats ? stats.enemyBulletMul : 1))),
          enemyHpBase,
          formation
      };
  }

  function seededRng(seed){
      let s=seed|0;
      return function(){
          s=(s^(s<<13))>>>0; s=(s^(s>>>17))>>>0; s=(s^(s<<5))>>>0;
          return (s>>>0)/4294967296;
      };
  }

  function generateBossSprite(seed){
      const rng=seededRng(seed*7919+13337);
      const bodyType=Math.floor(rng()*6);

      function makeFrame(frameOffset){
          const grid=[];
          for(let r=0;r<8;r++){
              const row=[];
              for(let c=0;c<12;c++) row.push(0);
              grid.push(row);
          }
          const r2=seededRng(seed*3571+frameOffset*997);

          if(bodyType===0){
              for(let c=2;c<10;c++) grid[4][c]=1;
              for(let c=1;c<11;c++) grid[3][c]=1;
              for(let c=0;c<12;c++) grid[5][c]=1;
              for(let c=2;c<10;c++) grid[6][c]=1;
              for(let c=4;c<8;c++) grid[2][c]=1;
              for(let c=4;c<8;c++) grid[7][c]=r2()<0.5?1:2;
              for(let c=4;c<8;c++) grid[1][c]=r2()<0.6?1:0;
              if(r2()<0.7) grid[0][5]=1; if(r2()<0.7) grid[0][6]=1;
          } else if(bodyType===1){
              for(let r=2;r<8;r++) for(let c=1;c<11;c++) grid[r][c]=1;
              for(let c=2;c<10;c++) grid[1][c]=1;
              grid[0][frameOffset?3:2]=1; grid[0][frameOffset?8:9]=1;
              grid[1][2]=2; grid[1][9]=2;
          } else if(bodyType===2){
              for(let r=3;r<8;r++) for(let c=1;c<11;c++) grid[r][c]=1;
              for(let c=1;c<11;c++) grid[2][c]=1;
              for(let c=1;c<11;c+=2) grid[1][c]=1;
              for(let c=1;c<11;c+=3) grid[0][c]=r2()<0.7?2:1;
          } else if(bodyType===3){
              for(let r=2;r<7;r++) for(let c=3;c<9;c++) grid[r][c]=1;
              for(let r=2;r<6;r++){
                  grid[r][frameOffset?1:0]=r2()<0.7?1:2;
                  grid[r][frameOffset?2:1]=1;
                  grid[r][frameOffset?9:10]=r2()<0.7?1:2;
                  grid[r][frameOffset?10:11]=1;
              }
              grid[7][1]=r2()<0.5?1:0; grid[7][10]=r2()<0.5?1:0;
          } else if(bodyType===4){
              for(let r=3;r<7;r++) for(let c=2;c<10;c++) grid[r][c]=1;
              grid[2][frameOffset?0:1]=1; grid[2][frameOffset?11:10]=1;
              grid[3][frameOffset?1:0]=2; grid[3][frameOffset?10:11]=2;
              grid[1][frameOffset?0:1]=r2()<0.6?1:0;
              grid[1][frameOffset?11:10]=r2()<0.6?1:0;
              for(let c=3;c<9;c++) grid[7][c]=r2()<0.4?1:0;
          } else {
              for(let r=1;r<6;r++) for(let c=2;c<10;c++) grid[r][c]=r2()<0.9?1:0;
              for(let r=1;r<6;r++){ grid[r][1]=1; grid[r][10]=1; }
              for(let c=2;c<10;c+=2){ grid[6][c]=1; grid[7][c]=r2()<0.6?2:1; }
              for(let c=3;c<10;c+=2) grid[6][c]=r2()<0.3?1:0;
          }

          const eyeRow=2+Math.floor(rng()*2);
          const eyeCol=3+Math.floor(rng()*2);
          grid[eyeRow][eyeCol]=3;
          grid[eyeRow][11-eyeCol]=3;

          for(let r=0;r<8;r++){
              for(let c=0;c<12;c++){
                  if(grid[r][c]===1 && r2()<0.15) grid[r][c]=2;
              }
          }

          const antCount=1+Math.floor(rng()*2);
          for(let i=0;i<antCount;i++){
              const ac=3+Math.floor(rng()*6);
              if(grid[0][ac]===0) grid[0][ac]=frameOffset?2:1;
              if(grid[1][ac]===0) grid[1][ac]=1;
          }

          return grid;
      }

      return { f0: makeFrame(0), f1: makeFrame(1) };
  }

  const BOSS_ATTACKS=['spread','bombs','beam','ring','rain','dash','aimed'];

  function pickBossAttack(level){
      const tier=Math.floor((level-1)/20);
      const pool=[];
      function push(id,w){ pool.push({id,weight:w}); }
      push('spread', 8);
      push('aimed',  6);
      push('ring',   3 + tier*0.6);
      push('bombs',  2 + tier*0.9);
      push('rain',   2 + tier*0.8);
      if(level>=15) push('beam', 2 + tier*0.8);
      if(level>=25) push('dash', 1.5 + tier*0.9);
      return weightedPick(pool).id;
  }

  function mkBoss(lvl, difficulty, stats){
      const d=difficulty||0;
      const bossIndex=Math.floor(lvl/5)-1;
      const palette=getBossPalette(bossIndex);
      const colors=palette[0];
      const fireColor=palette[1];
      const stage=Math.floor((lvl-1)/25);
      const hpBase = bossIndex < 4
          ? 15 + bossIndex * 6
          : 15 + bossIndex * 6 + Math.pow(bossIndex - 3, 1.55) * 14;
      const hp=Math.max(15, Math.round((hpBase + d*5) * (stats ? stats.bossHpMul : 1)));
      return {
          x:0.3,y:0.22,w:0.4,h:0.10,
          vx:rnd(0.00048,0.00085)+stage*0.00003,
          hp,maxHp:hp,
          alive:true,
          attackTimer:0,
          attackInterval:Math.max(680, Math.round((2500 - lvl*5.8 - stage*75 - d*55) * (stats ? stats.enemyBulletMul : 1))),
          phase:0,
          bossIndex,
          bodyColor:colors[0],
          accentColor:colors[1],
          eyeColor:colors[2],
          fireColor,
          bossName:BOSS_NAMES[bossIndex % BOSS_NAMES.length],
          hitFlash:0,
          currentAttack:null,
          attackState:null,
          animFrame:0,
          animTimer:0,
          d
      };
  }

  function mkEnemies(cfg, lvl){
      const enemies=[];
      const {cols,rows,formation,enemyHpBase}=cfg;
      const gridW=cols*(ENEMY_W+ENEMY_PAD_X)-ENEMY_PAD_X;
      const startX=(1-gridW)/2;
      const startY=0.10 + Math.min(0.06, Math.floor((lvl-1)/45)*0.006);

      for(let r=0;r<rows;r++){
          for(let c=0;c<cols;c++){
              if(!hasSwarmCell(formation,r,c,rows,cols,lvl)) continue;
              const arch=pickEnemyArchetypeForLevel(lvl);
              const tier = r===0 ? 2 : (r<rows-1 ? 1 : 0);
              let x = startX + c*(ENEMY_W+ENEMY_PAD_X);
              let y = startY + r*(ENEMY_H+ENEMY_PAD_Y);
              if(formation==='stagger' || formation==='waves') x += (r&1) ? ENEMY_W*0.22 : 0;
              if(formation==='waves') y += Math.sin((c+lvl)*0.9)*0.005;
              if(formation==='zigzag') x += (r%2===0 ? 1 : -1) * 0.006;
              const hp = Math.max(1, Math.round(enemyHpBase * 1.0));
              enemies.push({
                  x,y,w:ENEMY_W,h:ENEMY_H,
                  tier,hp,maxHp:hp,alive:true,animFrame:0,
                  formation,
                  archetype:arch.id,
                  sprite:arch.sprite,
                  colors:arch.colors,
                  fireStyle:arch.fireStyle,
                  fireColor:arch.fireColor,
                  shootSpeedMul:1.0
              });
          }
      }

      if(enemies.length < 6){
          for(let r=0;r<rows;r++){
              for(let c=0;c<cols;c++){
                  if((r+c)&1) continue;
                  const arch=pickEnemyArchetypeForLevel(lvl);
                  const tier = r===0 ? 2 : (r<rows-1 ? 1 : 0);
                  const hp = Math.max(1, Math.round(enemyHpBase * 1.0));
                  enemies.push({
                      x:startX + c*(ENEMY_W+ENEMY_PAD_X),
                      y:startY + r*(ENEMY_H+ENEMY_PAD_Y),
                      w:ENEMY_W,h:ENEMY_H,
                      tier,hp,maxHp:hp,alive:true,animFrame:0,
                      formation,
                      archetype:arch.id,
                      sprite:arch.sprite,
                      colors:arch.colors,
                      fireStyle:arch.fireStyle,
                      fireColor:arch.fireColor,
                      shootSpeedMul:1.0
                  });
              }
          }
      }
      return enemies;
  }

  // ── Web Audio sound system (fully synthesized, no external assets) ─────────
  function createSoundSystem(initialSettings){
      const AC = (typeof window!=='undefined') ? (window.AudioContext||window.webkitAudioContext) : null;
      let actx=null, master=null, musicGain=null, sfxGain=null;
      let musicTimer=null, stepIndex=0, nextNoteTime=0, currentKind=null;

      const midi=function(m){ return 440*Math.pow(2,(m-69)/12); };

      // Music patterns: arrays of 8th-note steps. b=bass(midi), a=arp(midi), k=kick, h=hat
      const BG_PATTERN=[
          {b:45,a:57},{a:60},{a:64},{a:69},{b:45,a:67},{a:64},{a:60},{a:67},
          {b:43,a:55},{a:57},{a:60},{a:64},{b:43,a:62},{a:60},{a:57},{a:62}
      ];
      const BOSS_PATTERN=[
          {b:45,k:1},{b:45},{b:45,h:1},{b:45},{b:45,k:1},{b:48},{b:45,h:1},{b:45},
          {b:43,k:1},{b:43},{b:43,h:1},{b:45},{b:45,k:1},{b:48},{b:43,h:1},{b:43}
      ];

      function ensureCtx(){
          if(actx) return true;
          if(!AC) return false;
          try{
              actx=new AC();
              master=actx.createGain(); master.gain.value=1; master.connect(actx.destination);
              musicGain=actx.createGain(); musicGain.connect(master);
              sfxGain=actx.createGain(); sfxGain.connect(master);
              return true;
          }catch(_){ actx=null; return false; }
      }
      function stopMusic(){
          if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
          currentKind=null;
      }
      function tone(freq,t,dur,type,dest,vol){
          if(!actx) return;
          const o=actx.createOscillator(), g=actx.createGain();
          o.type=type; o.frequency.setValueAtTime(freq,t);
          g.gain.setValueAtTime(0,t);
          g.gain.linearRampToValueAtTime(vol,t+0.012);
          g.gain.setValueAtTime(vol,t+dur*0.7);
          g.gain.linearRampToValueAtTime(0,t+dur);
          o.connect(g); g.connect(dest);
          o.start(t); o.stop(t+dur+0.02);
      }
      function scheduleStep(step,t,stepDur,kind){
          if(!actx) return;
          if(step.b){
              if(kind==='boss') tone(midi(step.b),t,stepDur*1.8,'sawtooth',musicGain,0.8);
              else tone(midi(step.b),t,stepDur*3.5,'triangle',musicGain,0.7);
          }
          if(step.a){
              tone(midi(step.a),t,stepDur*0.95,(kind==='boss'?'square':'sine'),musicGain,kind==='boss'?0.5:0.6);
          }
          if(step.k){
              const o=actx.createOscillator(), g=actx.createGain();
              o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
              g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
              o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.2);
          }
          if(step.h){
              const buf=actx.createBuffer(1,Math.max(1,actx.sampleRate*0.05)|0,actx.sampleRate);
              const d=buf.getChannelData(0);
              for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
              const s=actx.createBufferSource(); s.buffer=buf;
              const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
              const g=actx.createGain(); g.gain.setValueAtTime(0.4,t);
              s.connect(f); f.connect(g); g.connect(musicGain); s.start(t);
          }
      }
      function startMusic(kind){
          stopMusic();
          if(!ensureCtx()) return;
          const bpm=kind==='boss'?150:108;
          const stepDur=60/bpm/2;
          const pattern=kind==='boss'?BOSS_PATTERN:BG_PATTERN;
          stepIndex=0;
          nextNoteTime=actx.currentTime+0.06;
          currentKind=kind;
          musicTimer=setInterval(function(){
              if(!actx) return;
              while(nextNoteTime<actx.currentTime+0.18){
                  scheduleStep(pattern[stepIndex%pattern.length],nextNoteTime,stepDur,kind);
                  nextNoteTime+=stepDur;
                  stepIndex++;
              }
          },25);
      }
      function playSfx(key,baseVolume){
          if(!ensureCtx()) return;
          const t=actx.currentTime;
          const vol=clamp(baseVolume/0.12,0,1);
          if(key==='shoot'){
              const o=actx.createOscillator(), g=actx.createGain();
              o.type='square'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(320,t+0.09);
              g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol*0.6,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
              o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.14);
          } else if(key==='invaderKilled'){
              const dur=0.45;
              const buf=actx.createBuffer(1,Math.max(1,actx.sampleRate*dur)|0,actx.sampleRate);
              const d=buf.getChannelData(0);
              for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
              const s=actx.createBufferSource(); s.buffer=buf;
              const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(2500,t); f.frequency.exponentialRampToValueAtTime(200,t+dur);
              const g=actx.createGain(); g.gain.setValueAtTime(vol*0.8,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
              s.connect(f); f.connect(g); g.connect(sfxGain); s.start(t);
              const o=actx.createOscillator(), g2=actx.createGain();
              o.type='sine'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(40,t+0.3);
              g2.gain.setValueAtTime(vol*0.6,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
              o.connect(g2); g2.connect(sfxGain); o.start(t); o.stop(t+0.4);
          } else if(key==='swarmMove'){
              const o=actx.createOscillator(), g=actx.createGain();
              const lfo=actx.createOscillator(), lfoG=actx.createGain();
              o.type='sine'; o.frequency.setValueAtTime(1100,t);
              lfo.type='sine'; lfo.frequency.setValueAtTime(9,t); lfoG.gain.setValueAtTime(180,t);
              lfo.connect(lfoG); lfoG.connect(o.frequency);
              g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol*0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
              o.connect(g); g.connect(sfxGain);
              lfo.start(t); o.start(t); o.stop(t+0.4); lfo.stop(t+0.4);
          }
      }

      const sys={
          unlocked:false,
          pendingLoop:'bg',
          muted: !!initialSettings.muted,
          musicVolume: clamp(initialSettings.musicVolume,0,1),
          sfxVolume: clamp(initialSettings.sfxVolume,0,1),
          save:function(){
              saveAudioSettings({muted:this.muted,musicVolume:this.musicVolume,sfxVolume:this.sfxVolume});
          },
          applyVolumes:function(){
              if(!actx) return;
              const t=actx.currentTime;
              musicGain.gain.setValueAtTime(this.muted?0:this.musicVolume,t);
              sfxGain.gain.setValueAtTime(this.muted?0:this.sfxVolume,t);
          },
          stopAllLoops:function(resetTime){ stopMusic(); },
          resetForNewRun:function(){
              stopMusic();
              this.pendingLoop='bg';
              this.applyVolumes();
              if(this.unlocked && !this.muted){ startMusic('bg'); }
          },
          playOne:function(url,baseVolume){
              if(!this.unlocked || this.muted) return;
              playSfx(url,baseVolume);
          },
          ensureUnlocked:function(){
              if(this.unlocked) return;
              this.unlocked=true;
              ensureCtx();
              this.applyVolumes();
              this.applyLoop(this.pendingLoop||'bg');
          },
          applyLoop:function(kind){
              this.pendingLoop=kind;
              this.applyVolumes();
              if(!this.unlocked) return;
              if(!ensureCtx()) return;
              if(currentKind===kind) return;
              startMusic(kind);
          },
          setMuted:function(v){ this.muted=!!v; this.applyVolumes(); this.save(); },
          toggleMuted:function(){ this.setMuted(!this.muted); },
          adjustMusic:function(delta){
              this.musicVolume=clamp(Math.round((this.musicVolume+delta)*100)/100,0,1);
              this.applyVolumes(); this.save();
          },
          adjustSfx:function(delta){
              this.sfxVolume=clamp(Math.round((this.sfxVolume+delta)*100)/100,0,1);
              this.save();
          }
      };
      sys.applyVolumes();
      return sys;
  }
